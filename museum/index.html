<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="normalize.css">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Forum&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <title>Museum</title>
</head>

<body>
    <header class="header">
        <div class="container header__container">
            <div class="header__logo logo">
                <a href="#" class="header__logo-link logo__link">
                    <span class="logo__image"></span>
                    <span class="logo__title">Louvre</span>
                </a>
            </div>

            <nav class="header__navigation navigation">
                <ul class="header__navigation-list navigation__list">
                    <li class="header__navigation-item navigation__item"><a href="#"
                            class="header__navigation-link navigation__link">Visiting</a></li>
                    <li class="header__navigation-item navigation__item"><a href="#"
                            class="header__navigation-link navigation__link">Explore</a></li>
                    <li class="header__navigation-item navigation__item"><a href="#"
                            class="header__navigation-link navigation__link">Video</a></li>
                    <li class="header__navigation-item navigation__item"><a href="#"
                            class="header__navigation-link navigation__link">Gallery</a></li>
                    <li class="header__navigation-item navigation__item"><a href="#"
                            class="header__navigation-link navigation__link">Tickets</a></li>
                    <li class="header__navigation-item navigation__item"><a href="#"
                            class="header__navigation-link navigation__link">Contacts</a></li>
                </ul>
            </nav>
        </div>
    </header>


    <main class="main">
        <section id="Welcome" class="section Welcome">
            <div class="container Welcome__container">
                <div class="Welcome__content">
                    <h1 class="Welcome__title">Welcome<br>to the Louvre</h1>
                    <h2 class="Welcome__subtitle">From the castle to the museum</h2>
                    <div class="Welcome__link-btn"><a href="" class="Welcome__link-btn-text">Discover the Louvre</a>
                    </div>
                </div>
                <div class="Welcome__slider slider">
                    <div class="slider__container">
                        <div class="slider__image"></div>
                        <div class="slider__controls">
                            <div class="slider__slide-counter">
                                <span class="slider__current-slide">01</span>
                                <span class="slider__divider">|</span>
                                <span class="slider__total-slides">05</span>
                            </div>

                            <div class="slider__pagination">
                                <div class="slider__dot slider__dot--active"></div>
                                <div class="slider__dot"></div>
                                <div class="slider__dot"></div>
                                <div class="slider__dot"></div>
                                <div class="slider__dot"></div>
                            </div>

                            <div class="slider__arrows">
                                <div class="slider__arrow slider__arrow-left"></div>
                                <div class="slider__arrow slider__arrow-right"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            </div>
        </section>

        <section id="Welcome" class="section Visiting">
            <div class="container">

            </div>
        </section>

        <section id="Explore" class="section Explore">
            <div class="container">

            </div>
        </section>

        <section id="Video" class="section Video">
            <div class="container">

            </div>
        </section>

        <section id="Gallery" class="section Gallery">
            <div class="container">

            </div>
        </section>

        <section id="Tickets" class="section Tickets">
            <div class="container">

            </div>
        </section>

        <section id="Contacts" class="section Contacts">
            <div class="container">

            </div>
        </section>
    </main>

    <footer class="footer">
        <div class="container">

        </div>
    </footer>
</body>

</html>
